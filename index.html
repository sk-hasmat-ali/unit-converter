<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="index.css">
</head>
<body class="container">
    <div id="head">
        <h1> metric/imperial unit conversion</h1>
        <input id="input-ele" type="text" >
        <button id="convert-btn"> convert</button>
    </div>
    <div id="length">
        <h3> Length(Meter/feet)</h3>
        <p id="length-ele">meter = feet || feet = meters </p>
    </div>
     <div id="volume">
        <h3> volume(Liters/gallons)</h3>
        <p id="volume-ele"> liters = gallons || gallons = liters </p>
    </div>
     <div id="mass">
        <h3>Mass(kilogram/Pounds)</h3>
        <p id="mass-ele">kilos = pounds ||   pounds =   kilos</p>
    </div>
    <script src="index.js"></script>
</body>
</html>
